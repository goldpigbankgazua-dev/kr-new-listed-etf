<title>국내 신규상장 ETF</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  background: #f7f8fa;
  color: #1a1d24;
  line-height: 1.55;
  padding: 20px;
  -webkit-text-size-adjust: 100%;
}
.container { max-width: 1200px; margin: 0 auto; }
header { margin-bottom: 24px; }
h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; color: #0f172a; }
.subtitle { color: #64748b; font-size: 14px; }

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  margin: 20px 0;
}
.stat-box {
  background: white;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  padding: 14px 16px;
}
.stat-num { font-size: 22px; font-weight: 700; color: #0ea5e9; }
.stat-label { font-size: 12px; color: #64748b; margin-top: 2px; }

.controls {
  background: white;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  align-items: center;
}
.filter-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.filter-label { font-size: 12px; color: #475569; font-weight: 600; margin-right: 4px; }
.chip {
  padding: 5px 11px;
  border-radius: 20px;
  background: #f1f5f9;
  border: 1px solid transparent;
  font-size: 12px;
  cursor: pointer;
  color: #475569;
  transition: all 0.15s;
  user-select: none;
}
.chip:hover { background: #e2e8f0; }
.chip.active { background: #0ea5e9; color: white; }
.search {
  flex: 1;
  min-width: 200px;
  padding: 10px 14px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-size: 16px;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
}
.search:focus { border-color: #0ea5e9; box-shadow: 0 0 0 3px rgba(14,165,233,0.12); }

.date-section { margin-bottom: 24px; }
.date-header {
  background: linear-gradient(90deg, #0ea5e9, #6366f1);
  color: white;
  padding: 10px 16px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 15px;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.date-count {
  background: rgba(255,255,255,0.25);
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 12px;
}
.upcoming-pill {
  display: inline-block;
  font-size: 10px;
  padding: 1px 6px;
  background: rgba(255,255,255,0.25);
  color: white;
  border-radius: 4px;
  margin-left: 8px;
  font-weight: 600;
}

.etf-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 10px;
}
.etf-card {
  background: white;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  padding: 14px;
  cursor: pointer;
  transition: all 0.15s;
}
.etf-card:hover {
  border-color: #0ea5e9;
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(14, 165, 233, 0.08);
}
.card-top { display: flex; justify-content: space-between; align-items: start; gap: 8px; margin-bottom: 8px; }
.etf-name { font-weight: 600; font-size: 14px; color: #0f172a; line-height: 1.35; }
.ticker {
  background: #f1f5f9;
  padding: 2px 7px;
  border-radius: 5px;
  font-family: "SF Mono", monospace;
  font-size: 11px;
  color: #475569;
  white-space: nowrap;
}
.card-meta { display: flex; gap: 6px; flex-wrap: wrap; font-size: 11px; }
.tag {
  padding: 2px 7px;
  border-radius: 4px;
  background: #eff6ff;
  color: #1d4ed8;
  font-weight: 500;
}
.tag.fee { background: #fef3c7; color: #92400e; }
.tag.op { background: #f0fdf4; color: #166534; }

.overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(15, 23, 42, 0.55);
  z-index: 100;
  align-items: flex-start;
  justify-content: center;
  padding: 40px 20px;
  overflow-y: auto;
}
.overlay.show { display: flex; }
.modal {
  background: white;
  border-radius: 14px;
  padding: 24px;
  max-width: 560px;
  width: 100%;
  max-height: calc(100vh - 80px);
  overflow-y: auto;
}
.modal-close {
  float: right;
  border: none;
  background: #f1f5f9;
  width: 30px; height: 30px;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
  color: #64748b;
}
.modal-close:hover { background: #e2e8f0; }
.modal h2 { font-size: 18px; margin-bottom: 4px; line-height: 1.3; padding-right: 40px; }
.modal-ticker { font-family: "SF Mono", monospace; color: #0ea5e9; font-size: 13px; margin-bottom: 16px; }
.info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 18px;
  padding: 14px;
  background: #f8fafc;
  border-radius: 8px;
}
.info-item .label { font-size: 11px; color: #64748b; margin-bottom: 2px; }
.info-item .val { font-size: 13px; color: #0f172a; font-weight: 500; }
.strategy {
  background: #fefce8;
  border-left: 3px solid #eab308;
  padding: 12px 14px;
  border-radius: 6px;
  font-size: 13px;
  margin-bottom: 18px;
  line-height: 1.6;
  color: #374151;
}
.strategy-title {

  margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px;
}
.links-title { font-size: 13px; font-weight: 600; margin-bottom: 8px; color: #1e293b; }
.holdings-note {
  font-size: 12px; color: #64748b;
  margin-bottom: 10px; padding: 10px 12px;
  background: #f0f9ff; border-radius: 6px;
  border-left: 3px solid #0ea5e9;

.link-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.link-btn {
  display: flex; align-items: center; justify-content: center;
  gap: 6px; padding: 10px 12px; border-radius: 7px;
  text-decoration: none; font-size: 13px; font-weight: 500;
  border: 1px solid #e2e8f0; color: #1e293b;

.link-btn:hover { border-color: #0ea5e9; background: #f0f9ff; color: #0369a1; }
.link-btn.primary { background: #0ea5e9; border-color: #0ea5e9; color: white; }
.link-btn.primary:hover { background: #0284c7; color: white; }
.link-btn .arrow { font-size: 11px; opacity: 0.7; }

footer {

  border-top: 1px solid #e2e8f0;
  font-size: 12px;
  color: #64748b;
  line-height: 1.7;
}
footer a { color: #0ea5e9; text-decoration: none; }
.empty-state {

  padding: 40px;
  color: #94a3b8;
  background: white;
  border-radius: 10px;
  border: 1px dashed #cbd5e1;

@media (max-width: 640px) {

let activeTheme = "all";
let searchTerm = "";
const TODAY = new Date().toISOString().slice(0,10);

function escape(s){ return String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m])); }
function shortOp(op){ return op.replace("자산운용","").replace("투자신탁","").trim(); }

function renderStats(){
  const dates = [...new Set(ETFS.map(e=>e.date))];
  const ops = [...new Set(ETFS.map(e=>e.op))];
  document.getElementById("stats").innerHTML = `
    <div class="stat-box"><div class="stat-num">${ETFS.length}</div><div class="stat-label">전체 신규상장 ETF</div></div>
    <div class="stat-box"><div class="stat-num">${dates.length}</div><div class="stat-label">상장일 (영업일)</div></div>
    <div class="stat-box"><div class="stat-num">${ops.length}</div><div class="stat-label">운용사</div></div>
    <div class="stat-box"><div class="stat-num">2026.03–06</div><div class="stat-label">조사 기간</div></div>
  `;
}

function matchTheme(e, t){
  if (t === "all") return true;
  if (e.theme === t) return true;
  return e.themes.some(x => x.toLowerCase() === t.toLowerCase());
}

function render(){
  const filtered = ETFS.filter(e => {
    if (!matchTheme(e, activeTheme)) return false;
    if (searchTerm) {
      const s = searchTerm.toLowerCase();
      if (!e.name.toLowerCase().includes(s) && !e.ticker.toLowerCase().includes(s) && !e.op.toLowerCase().includes(s)) return false;
    }
    return true;
  });

  if (filtered.length === 0) {
    document.getElementById("content").innerHTML = '<div class="empty-state">조건에 맞는 ETF가 없습니다.</div>';
    return;
  }

  const grouped = {};
  filtered.forEach(e => { (grouped[e.date] = grouped[e.date] || []).push(e); });
  const dates = Object.keys(grouped).sort().reverse();

  document.getElementById("content").innerHTML = dates.map(d => {
    const items = grouped[d];
    const upcoming = d > TODAY;
    return `
      <div class="date-section">
        <div class="date-header">
          <span>📅 ${d.replace(/-/g,".")} 신규상장${upcoming ? '<span class="upcoming-pill">예정</span>' : ''}</span>
          <span class="date-count">${items.length}종</span>
        </div>
        <div class="etf-grid">
          ${items.map(e => `
            <div class="etf-card" onclick="openModal(${ETFS.indexOf(e)})">
              <div class="card-top">
                <div class="etf-name">${escape(e.name)}</div>
                <div class="ticker">${e.ticker}</div>
              </div>
              <div class="card-meta">
                <span class="tag op">${escape(shortOp(e.op))}</span>
                <span class="tag fee">총보수 ${e.fee}</span>
                ${e.themes.slice(0,2).map(t => `<span class="tag">${escape(t)}</span>`).join("")}
              </div>
            </div>
          `).join("")}
        </div>
      </div>
    `;
  }).join("");
}

function openModal(idx){
  const e = ETFS[idx];
  const etfcheckUrl = `https://www.etfcheck.co.kr/mobile/etpitem/${e.ticker}/basic`;
  const naverUrl = `https://finance.naver.com/item/main.naver?code=${e.ticker}`;
  const krxUrl = `https://data.krx.co.kr/contents/MDC/MDI/mdiLoader/index.cmd?menuId=MDC020103010701`;
  const googleSearch = `https://www.google.com/search?q=${encodeURIComponent(e.name + " 자산구성내역 " + e.ticker)}`;
  const upcoming = e.date > TODAY;

  document.getElementById("modal").innerHTML = `
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h2>${escape(e.name)}</h2>
    <div class="modal-ticker">티커 · ${e.ticker}</div>
    <div class="info-grid">
      <div class="info-item"><div class="label">상장일</div><div class="val">${e.date.replace(/-/g,".")}${upcoming ? ' (예정)' : ''}</div></div>
      <div class="info-item"><div class="label">운용사</div><div class="val">${escape(e.op)}</div></div>
      <div class="info-item"><div class="label">총보수</div><div class="val">${e.fee}</div></div>
      <div class="info-item"><div class="label">기초지수</div><div class="val">${escape(e.idx)}</div></div>
    </div>
    <div class="strategy">
      <div class="strategy-title">전략 / 컨셉</div>
      ${escape(e.desc)}
    </div>
    <div class="links-title">📊 편입종목 & 비중 확인하기</div>
    <div class="holdings-note">편입종목·비중은 매일 갱신됩니다. 아래 링크에서 최신 데이터를 확인하세요.</div>
    <div class="link-btns">
      <a class="link-btn primary" href="${etfcheckUrl}" target="_blank" rel="noopener">ETF CHECK <span class="arrow">↗</span></a>
      <a class="link-btn" href="${naverUrl}" target="_blank" rel="noopener">네이버 금융 <span class="arrow">↗</span></a>
      <a class="link-btn" href="${googleSearch}" target="_blank" rel="noopener">운용사 PDF 검색 <span class="arrow">↗</span></a>
      <a class="link-btn" href="${krxUrl}" target="_blank" rel="noopener">KRX 정보데이터 <span class="arrow">↗</span></a>
    </div>
  `;
  document.getElementById("overlay").classList.add("show");
  document.body.style.overflow = "hidden";
}

function closeModal(){
  document.getElementById("overlay").classList.remove("show");
  document.body.style.overflow = "";
}

document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

document.querySelectorAll(".chip").forEach(chip => {
  chip.addEventListener("click", () => {
    document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    activeTheme = chip.dataset.theme;
    render();
  });
});

document.getElementById("search").addEventListener("input", e => {
  searchTerm = e.target.value;
  render();
});

renderStats();
render();
</script>
</body>
</html>
