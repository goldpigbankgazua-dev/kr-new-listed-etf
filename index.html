  --tag-text: #7dd3fc;
  --fee-bg: #422006;
  --fee-text: #fcd34d;
  --op-bg: #052e16;
  --op-text: #86efac;
  --strategy-bg: #1c1505;
  --strategy-bd: #ca8a04;
  --strategy-title: #fcd34d;
  --note-bg: #082f49;
  --note-bd: #38bdf8;
  --note-text: #cbd5e1;

[data-theme="green"] {

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overflow-x: hidden; max-width: 100vw; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
  padding: 20px;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background .15s ease, color .15s ease;
}
.container { max-width: 1200px; margin: 0 auto; }

header { margin-bottom: 14px; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.header-left { flex: 1; min-width: 200px; }
h1 { font-size: 22px; font-weight: 700; margin-bottom: 2px; color: var(--text-strong); }
.subtitle { color: var(--muted); font-size: 13px; }

/* 컴팩트 기준일 배지 (RS 스크리너 .basedate 동일 규격) */
.basedate {
  color: var(--text); background: var(--panel); border: 1px solid var(--border);
  padding: 6px 12px; border-radius: 8px; font-size: 12px;
  white-space: nowrap; flex-shrink: 0;
}
.basedate b { color: var(--accent); }

.controls {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  align-items: center;
}
.filter-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip {
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--chip);
  border: 1px solid transparent;
  font-size: 12px;
  font-weight: 500;
  line-height: 1.2;
  cursor: pointer;
  color: var(--chip-text);
  transition: all 0.15s;
  user-select: none;
  white-space: nowrap;
}
.chip:hover { filter: brightness(0.95); }
[data-theme="dark"] .chip:hover { filter: brightness(1.3); }
.chip.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }

.search {
  flex: 1;
  min-width: 200px;
  max-width: 320px;
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 12px;
  height: 32px;
  line-height: 1.2;
  outline: none;
  background: var(--panel-2);
  color: var(--text);
  -webkit-appearance: none;
  appearance: none;
}
.search::placeholder { color: var(--muted); font-size: 12px; }
.search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.date-section { margin-bottom: 28px; }
.date-header {
  background: linear-gradient(90deg, var(--accent-soft) 0%, transparent 70%);
  color: var(--text-strong);
  border: none;
  padding: 10px 14px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.1px;
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.date-header > span:first-child {
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.date-header > span:first-child::before,
.date-header > span:first-child::after {
  content: '';
  display: inline-block;
  width: 3px; height: 20px;
  background: var(--accent);
  border-radius: 2px;
  flex-shrink: 0;
}
.date-count {
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--border);
  padding: 3px 11px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0;
}
.upcoming-pill {
  display: inline-block;
  font-size: 10px;
  padding: 2px 7px;
  background: var(--accent);
  color: #ffffff;
  border-radius: 4px;
  margin-left: 4px;
  font-weight: 600;
  letter-spacing: 0.2px;
  vertical-align: middle;
}

.etf-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 10px;
}
.etf-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  cursor: pointer;
  transition: all 0.15s;
}
.etf-card:hover {
  border-color: var(--accent);
  transform: translateY(-1px);
  box-shadow: var(--shadow-hover);
}
.card-top { display: flex; justify-content: space-between; align-items: start; gap: 8px; margin-bottom: 8px; }
.etf-name { font-weight: 600; font-size: 14px; color: var(--text-strong); line-height: 1.35; }
.ticker {
  background: var(--chip);
  padding: 2px 7px;
  border-radius: 5px;
  font-family: "SF Mono", monospace;
  font-size: 11px;
  color: var(--chip-text);
  white-space: nowrap;
}
.card-meta { display: flex; gap: 6px; flex-wrap: wrap; font-size: 11px; }
.tag {
  padding: 2px 7px;
  border-radius: 4px;
  background: var(--tag-bg);
  color: var(--tag-text);
  font-weight: 500;
}
.tag.fee { background: var(--fee-bg); color: var(--fee-text); }
.tag.op  { background: var(--op-bg);  color: var(--op-text); }

.overlay {
  display: none;
  position: fixed; inset: 0;
  background: var(--overlay);
  z-index: 100;
  align-items: flex-start;
  justify-content: center;
  padding: 40px 20px;
  overflow-y: auto;
}
.overlay.show { display: flex; }
.modal {
  background: var(--panel);
  border-radius: 14px;
  padding: 24px;
  max-width: 560px;
  width: 100%;
  max-height: calc(100vh - 80px);
  overflow-y: auto;
  color: var(--text);
  border: 1px solid var(--border);
}
.modal-close {
  float: right;
  border: none;
  background: var(--modal-close-bg);
  width: 30px; height: 30px;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
  color: var(--modal-close-color);
}
.modal-close:hover { filter: brightness(0.95); }
[data-theme="dark"] .modal-close:hover { filter: brightness(1.3); }
.modal h2 { font-size: 18px; margin-bottom: 4px; line-height: 1.3; padding-right: 40px; color: var(--text-strong); }
.modal-ticker { font-family: "SF Mono", monospace; color: var(--accent); font-size: 13px; margin-bottom: 16px; }
.info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 18px;
  padding: 14px;
  background: var(--panel-2);
  border-radius: 8px;
}
.info-item .label { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
.info-item .val { font-size: 13px; color: var(--text-strong); font-weight: 500; }
.strategy {
  background: var(--strategy-bg);
  border-left: 3px solid var(--strategy-bd);
  padding: 12px 14px;
  border-radius: 6px;
  font-size: 13px;
  margin-bottom: 18px;
  line-height: 1.6;
  color: var(--text);
}
.strategy-title {
  font-size: 11px; font-weight: 700; color: var(--strategy-title);
  margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px;
}
.links-title { font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--text-strong); }
.holdings-note {
  font-size: 12px; color: var(--note-text);
  margin-bottom: 10px; padding: 10px 12px;
  background: var(--note-bg); border-radius: 6px;
  border-left: 3px solid var(--note-bd);
}
.link-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.link-btn {
  display: flex; align-items: center; justify-content: center;
  gap: 6px; padding: 10px 12px; border-radius: 7px;
  text-decoration: none; font-size: 13px; font-weight: 500;
  border: 1px solid var(--border); color: var(--text-strong);
  background: var(--panel); transition: all 0.15s;
}
.link-btn:hover { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.link-btn.primary { background: var(--accent); border-color: var(--accent); color: #ffffff; }
.link-btn.primary:hover { filter: brightness(0.92); color: #ffffff; }
.link-btn .arrow { font-size: 11px; opacity: 0.7; }

footer {
  margin-top: 30px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--muted);
  line-height: 1.7;
}
footer a { color: var(--accent); text-decoration: none; }
footer strong { color: var(--text-strong); }
.empty-state {
  text-align: center;
  padding: 40px;
  color: var(--muted);
  background: var(--panel);
  border-radius: 10px;
  border: 1px dashed var(--border);
}
@media (max-width: 640px) {
  body { padding: 12px; }
  h1 { font-size: 19px; }
  header { gap: 8px; }
  .basedate { font-size: 11px; padding: 5px 10px; }
  .controls { padding: 10px; gap: 10px; flex-direction: column; align-items: stretch; }
  /* 필터 칩: 본체는 고정, 칩만 가로 스크롤. 스크롤바 숨김으로 깔끔하게 */
  .filter-group {
    overflow-x: auto;
    overflow-y: hidden;
    flex-wrap: nowrap;
    padding-bottom: 4px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    max-width: 100%;
  }
  .filter-group::-webkit-scrollbar { display: none; }
  .chip { white-space: nowrap; padding: 6px 12px; font-size: 12px; flex-shrink: 0; }
  .etf-grid { grid-template-columns: 1fr; gap: 8px; }
  .link-btns { grid-template-columns: 1fr; }
  .info-grid { grid-template-columns: 1fr; gap: 8px; padding: 10px; }
}
</style>

let activeTheme = "all";
let searchTerm = "";
const TODAY = new Date().toISOString().slice(0,10);

function escape(s){ return String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m])); }
function shortOp(op){ return op.replace("자산운용","").replace("투자신탁","").trim(); }

function renderStats(){
  // 기준일 = ETFS에서 가장 최근 상장일 (스크리너 실행일 자동 반영)
  const maxDate = ETFS.reduce((m, e) => e.date > m ? e.date : m, "");
  const el = document.getElementById("basedate");
  if (el) {
    el.innerHTML = `기준일 <b>${maxDate}</b> · ${ETFS.length}개 ETF`;
  }
}

function matchTheme(e, t){
  if (t === "all") return true;
  if (e.theme === t) return true;
  return e.themes.some(x => x.toLowerCase() === t.toLowerCase());
}

function render(){
  const filtered = ETFS.filter(e => {
    if (!matchTheme(e, activeTheme)) return false;
    if (searchTerm) {
      const s = searchTerm.toLowerCase();
      if (!e.name.toLowerCase().includes(s) && !e.ticker.toLowerCase().includes(s) && !e.op.toLowerCase().includes(s)) return false;
    }
    return true;
  });

  if (filtered.length === 0) {
    document.getElementById("content").innerHTML = '<div class="empty-state">조건에 맞는 ETF가 없습니다.</div>';
    return;
  }

  const grouped = {};
  filtered.forEach(e => { (grouped[e.date] = grouped[e.date] || []).push(e); });

  const dates = Object.keys(grouped).sort().reverse();

  document.getElementById("content").innerHTML = dates.map(d => {
    const items = grouped[d];
    const upcoming = d > TODAY;
    return `
      <div class="date-section">
        <div class="date-header">
          <span>${d.replace(/-/g,".")} 신규상장${upcoming ? '<span class="upcoming-pill">예정</span>' : ''}</span>
          <span class="date-count">${items.length}종</span>
        </div>
        <div class="etf-grid">
          ${items.map(e => `
            <div class="etf-card" onclick="openModal(${ETFS.indexOf(e)})">
              <div class="card-top">
                <div class="etf-name">${escape(e.name)}</div>
                <div class="ticker">${e.ticker}</div>
              </div>
              <div class="card-meta">
                <span class="tag op">${escape(shortOp(e.op))}</span>
                <span class="tag fee">총보수 ${e.fee}</span>
                ${e.themes.slice(0,2).map(t => `<span class="tag">${escape(t)}</span>`).join("")}
              </div>
            </div>
          `).join("")}
        </div>
      </div>
    `;
  }).join("");
}

function openModal(idx){
  const e = ETFS[idx];
  const etfcheckUrl = `https://www.etfcheck.co.kr/mobile/etpitem/${e.ticker}/basic`;
  const naverUrl = `https://finance.naver.com/item/main.naver?code=${e.ticker}`;
  const krxUrl = `https://data.krx.co.kr/contents/MDC/MDI/mdiLoader/index.cmd?menuId=MDC020103010701`;
  const googleSearch = `https://www.google.com/search?q=${encodeURIComponent(e.name + " 자산구성내역 " + e.ticker)}`;
  const upcoming = e.date > TODAY;

  document.getElementById("modal").innerHTML = `
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h2>${escape(e.name)}</h2>
    <div class="modal-ticker">티커 · ${e.ticker}</div>
    <div class="info-grid">
      <div class="info-item"><div class="label">상장일</div><div class="val">${e.date.replace(/-/g,".")}${upcoming ? ' (예정)' : ''}</div></div>
      <div class="info-item"><div class="label">운용사</div><div class="val">${escape(e.op)}</div></div>
      <div class="info-item"><div class="label">총보수</div><div class="val">${e.fee}</div></div>
      <div class="info-item"><div class="label">기초지수</div><div class="val">${escape(e.idx)}</div></div>
    </div>
    <div class="strategy">
      <div class="strategy-title">전략 / 컨셉</div>
      ${escape(e.desc)}
    </div>
    <div class="links-title">편입종목 &amp; 비중 확인하기</div>
    <div class="holdings-note">편입종목·비중은 매일 갱신됩니다. 아래 링크에서 최신 데이터를 확인하세요.</div>
    <div class="link-btns">
      <a class="link-btn primary" href="${etfcheckUrl}" target="_blank" rel="noopener">ETF CHECK <span class="arrow">↗</span></a>
      <a class="link-btn" href="${naverUrl}" target="_blank" rel="noopener">네이버 금융 <span class="arrow">↗</span></a>
      <a class="link-btn" href="${googleSearch}" target="_blank" rel="noopener">운용사 PDF 검색 <span class="arrow">↗</span></a>
      <a class="link-btn" href="${krxUrl}" target="_blank" rel="noopener">KRX 정보데이터 <span class="arrow">↗</span></a>
    </div>
  `;
  document.getElementById("overlay").classList.add("show");
  document.body.style.overflow = "hidden";
}

function closeModal(){
  document.getElementById("overlay").classList.remove("show");
  document.body.style.overflow = "";
}

document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

document.querySelectorAll(".chip[data-theme-filter]").forEach(chip => {
  chip.addEventListener("click", () => {
    document.querySelectorAll(".chip[data-theme-filter]").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    activeTheme = chip.dataset.themeFilter;
    render();
  });
});

document.getElementById("search").addEventListener("input", e => {
  searchTerm = e.target.value;
  render();
});

/* ===== 테마: 허브 단일 컨트롤러에서 신호 받음 (postMessage + URL 파라미터) ===== */
const THEMES = ["light", "dark", "green"];
function applyAppTheme(t) {
  if (!THEMES.includes(t)) t = "light";
  document.documentElement.setAttribute("data-theme", t);
  localStorage.setItem("kr_etf_theme", t);
}
const _urlTheme = new URLSearchParams(location.search).get("theme");
applyAppTheme(_urlTheme || localStorage.getItem("kr_etf_theme") || "light");
window.addEventListener("message", e => {
  if (e.data && e.data.type === "yeobtoni-theme") applyAppTheme(e.data.value);
});

renderStats();
render();
</script>

</body>
</html>
